version: "4.1"
name: basic_framework_ATYPE
type: ARM
deviceName: STM32F427IIHx
packDir: null
srcDirs:
  - Core
  - Drivers
  - Middlewares
  - application
  - bsp
  - modules
virtualFolder:
  name: <virtual_root>
  files:
    - path: startup_stm32f427xx.s
  folders: []
dependenceList: []
outDir: build
miscInfo:
  uid: a427e1de20261111a427e1de20261111
targets:
  Debug:
    cppPreprocessAttrs:
      defineList:
        - DEBUG
        - USE_HAL_DRIVER
        - STM32F427xx
        - ARM_MATH_CM4
        - ARM_MATH_MATRIX_CHECK
        - ARM_MATH_ROUNDING
      incList:
        - Core/Inc
        - Drivers/STM32F4xx_HAL_Driver/Inc
        - Drivers/STM32F4xx_HAL_Driver/Inc/Legacy
        - Drivers/CMSIS/Device/ST/STM32F4xx/Include
        - Drivers/CMSIS/Include
        - Middlewares/Third_Party/FreeRTOS/Source/include
        - Middlewares/Third_Party/FreeRTOS/Source/CMSIS_RTOS
        - Middlewares/Third_Party/FreeRTOS/Source/portable/GCC/ARM_CM4F
        - Middlewares/ST/ARM/DSP/Inc
        - Middlewares/Third_Party/SEGGER/RTT
        - Middlewares/Third_Party/SEGGER/Config
        - application
        - application/chassis
        - application/shoot
        - application/gimbal
        - application/cmd
        - application/test
        - bsp
        - bsp/dwt
        - bsp/can
        - bsp/usart
        - bsp/gpio
        - bsp/spi
        - bsp/iic
        - bsp/log
        - bsp/pwm
        - modules
        - modules/algorithm
        - modules/master_machine
        - modules/motor
        - modules/motor/DJImotor
        - modules/motor/LKmotor
        - modules/motor/HTmotor
        - modules/motor/step_motor
        - modules/motor/servo_motor
        - modules/motor/PWMmotor
        - modules/oled
        - modules/mpu6500
        - modules/remote
        - modules/can_comm
        - modules/message_center
        - modules/daemon
        - modules/vofa
        - modules/alarm
        - modules/bluetooth
        - modules/graysensor
        - modules/TFminiPlus
        - modules/power
        - modules/key
      libList:
        - Middlewares/ST/ARM/DSP/Lib
    excludeList:
      - bsp/adc/bsp_adc.c
      - modules/ps_handle/ps_handle.c
      - modules/standard_cmd/std_cmd.c
      - modules/unicomm/unicomm.c
    settings:
      debugger: cortex-debug
    toolchain: GCC
    toolchainConfigMap:
      GCC:
        archExtensions: ""
        cpuType: Cortex-M4
        floatingPointHardware: single
        options:
          version: 5
          afterBuildTasks: []
          asm-compiler:
            ASM_FLAGS: ""
          beforeBuildTasks: []
          c/cpp-compiler:
            CXX_FLAGS: ""
            C_FLAGS: ""
            language-c: gnu11
            language-cpp: gnu++11
            one-elf-section-per-data: true
            one-elf-section-per-function: true
            optimization: level-debug
            warnings: all-warnings
          global:
            $float-abi-type: hard
            arm-thumb-mode: thumb
            output-debug-info: enable
          linker:
            $toolName: auto
            LD_FLAGS: -specs=nano.specs -TSTM32F427IIHx_FLASH.ld -LMiddlewares/ST/ARM/DSP/Lib
            LIB_FLAGS: -lc -lm -lnosys -l:libarm_cortexM4lf_math.a
            output-format: elf
            remove-unused-input-sections: true
        # Keep this empty so EIDE does not expand the linker script to an
        # absolute path containing Chinese characters. LD_FLAGS above passes
        # the script as a project-relative path instead.
        scatterFilePath: ""
        storageLayout:
          RAM: []
          ROM: []
        useCustomScatterFile: true
    uploadConfigMap:
      JLink:
        baseAddr: "0x08000000"
        bin: ""
        cpuInfo:
          cpuName: STM32F427II
          vendor: ST
        otherCmds: ""
        proType: 1
        speed: 4000
    uploader: JLink
